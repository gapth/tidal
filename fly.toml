app = "tidal-worker"
primary_region = "iad"

[build]
  dockerfile = "apps/worker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
